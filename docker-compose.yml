version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hotelops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-hotelops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotelops}
      POSTGRES_DB: ${DB_NAME:-hotelops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hotelops} -d ${DB_NAME:-hotelops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hotelops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: hotelops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hotelops
      MINIO_ROOT_PASSWORD: hotelops123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hotelops-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-hotelops}
      DB_PASSWORD: ${DB_PASSWORD:-hotelops}
      DB_NAME: ${DB_NAME:-hotelops}
      DATABASE_URL: postgresql://${DB_USER:-hotelops}:${DB_PASSWORD:-hotelops}@postgres:5432/${DB_NAME:-hotelops}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      PORT: 4000
      WEB_APP_URL: http://localhost
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@hotelops.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-password123}
    volumes:
      - ./apps/api:/app/apps/api
      - ./apps/web/package.json:/app/apps/web/package.json
      - ./packages/database:/app/packages/database
      - /app/node_modules
      - /app/packages/database/generated
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh apps/api/entrypoint.sh

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hotelops-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules
      - /app/apps/web/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: hotelops-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
